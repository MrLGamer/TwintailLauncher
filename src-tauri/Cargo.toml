[package]
name = "twintaillauncher"
version = "2.5.0-cef"
description = "A multi-platform launcher for your anime games"
authors = ["TwintailTeam"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "twintaillauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# feat/cef pinned to f5c75303/bc005c44 - newer commits on that branch break CEF window creation (Runtime(CreateWindow))
[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "f5c7530354cb66b5859b9f5d11c8ec1a053448b3", features = [] }#{ version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.2", default-features = false, features = ["unstable", "common-controls-v6", "compression", "tray-icon", "image-ico", "image-png", "cef"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.52", features = ["sync", "rt"] }
uuid = { version = "1", features = ["v7"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "json", "migrate", "runtime-tokio"] }
serde_json = "1"
gumdrop = "0.8.1"
fischl = { git = "https://github.com/TwintailTeam/fischl-rs.git", branch = "master", features = ["compat", "download"] }
git2 = { version = "0.21", features = ["https", "vendored-libgit2", "vendored-openssl"] }
steam_shortcuts_util = "1.1.8"
rpcdiscord = { git = "https://github.com/TukanDev/rpcdiscord.git", branch = "main" }
keepawake = "0.6.0"
log = "0.4.33"

# tauri plugins
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "bc005c44b0573de9a6b860a4cf2e5cc730611325" }#"2.8.0"
# xdg-portal (not the default gtk3) backend: GTK file dialogs deadlock under the CEF ozone/wayland event loop
tauri-plugin-dialog = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "bc005c44b0573de9a6b860a4cf2e5cc730611325", default-features = false, features = ["xdg-portal"] }#"2.7.1"
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "bc005c44b0573de9a6b860a4cf2e5cc730611325" }#"2.5.4"
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "bc005c44b0573de9a6b860a4cf2e5cc730611325" }#"2.4.2"
tauri-plugin-clipboard-manager = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "bc005c44b0573de9a6b860a4cf2e5cc730611325" }#"2.3.2"

[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "f5c7530354cb66b5859b9f5d11c8ec1a053448b3" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", rev = "f5c7530354cb66b5859b9f5d11c8ec1a053448b3" }

# Vendored copy of the CEF runtime with a draggable-regions patch so the frameless
# custom-decorations window can be dragged on Wayland (see vendor/README.md).
[patch."https://github.com/tauri-apps/tauri"]
tauri-runtime-cef = { path = "vendor/tauri-runtime-cef" }

# Fuck NVIDIA btw
[target."cfg(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\"))".dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["vulkan"] }

[target."cfg(target_os = \"linux\")".dependencies]
# System light/dark preference via the settings portal (CEF has no GTK color-scheme
# integration, so prefers-color-scheme never updates); already in-tree via the
# xdg-portal dialog backend.
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }

[target."cfg(any(target_os = \"windows\"))".dependencies]
shortcuts-rs = "1.1.1"

[profile.dev]
opt-level = 1
incremental = true
overflow-checks = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
overflow-checks = false
